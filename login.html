<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cara</title>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-teal: #088178;      
            --primary-hover: #06655e;     
            --bg-light: #f4f6f6;          
            --text-dark: #1a1a1a;         
            --text-muted: #555555;        
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); /* Soft, natural shadow */
            text-align: center;
            position: relative;
        }

        /* Top navigation element back button */
        .back-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 25px;
            transition: color 0.3s;
        }

        .back-nav:hover {
            color: var(--primary-teal);
        }

        /* Cara Logo styling matching header */
        .logo {
            font-family: 'League Spartan', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .logo span {
            color: var(--primary-teal);
            font-size: 24px;
        }

        h2 {
            font-family: 'League Spartan', sans-serif;
            font-size: 24px;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        /* Form Controls */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e1e1e1;
            border-radius: 25px; /* Fully rounded inputs like modern UI design */
            font-size: 14px;
            background-color: #fafafa;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary-teal);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(8, 129, 120, 0.1);
        }

        /* Row containing Remember Me and Forgot Password */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .remember-me input {
            accent-color: var(--primary-teal); /* Styles native checkbox to teal */
            cursor: pointer;
        }

        .forgot-link {
            color: var(--primary-teal);
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Sign In Button - Matches the "Shop Now" design */
        .btn-submit {
            width: 100%;
            background-color: var(--primary-teal);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 25px; /* Matches standard pill buttons */
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(8, 129, 120, 0.2);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Bottom switching link */
        .register-footer {
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .register-footer a {
            color: var(--primary-teal);
            text-decoration: none;
            font-weight: 600;
        }

        .register-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <a href="#" class="back-nav">&#8592; Back to Shop</a>
        
        <div class="logo">Cara<span>.</span></div>
        <h2>Welcome Back! 😊</h2>
        <p class="subtitle">Please enter your details to sign in</p>

        <form>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@domain.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="register-footer">
            Don't have an account? <a href="#">Register</a>
        </div>
    </div>

</body>
</html>
